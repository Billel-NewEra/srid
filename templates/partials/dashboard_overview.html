<!-- Vue d'ensemble (filtre indépendant) -->
<div class="card bg-base-100 shadow-lg">
    <div class="card-body p-5">
        <div class="flex flex-wrap items-center justify-between gap-3 mb-3">
            <h2 class="card-title text-sm mb-0"><i class="fas fa-layer-group mr-2 text-primary"></i>Vue d'ensemble</h2>
            <div class="flex items-center gap-2 kpi-filter">
                <select name="year" data-year-filter class="select select-bordered select-xs"
                        hx-get="{{ url_for('api_dashboard_overview') }}"
                        hx-trigger="change"
                        hx-target="#dashboard-overview"
                        hx-include="closest .kpi-filter">
                    {% for y in available_years %}
                    <option value="{{ y }}" {% if selected_year == y %}selected{% endif %}>{{ y }}</option>
                    {% endfor %}
                </select>
                <select name="month" data-month-filter data-no-scroll="1" class="select select-bordered select-xs"
                        hx-get="{{ url_for('api_dashboard_overview') }}"
                        hx-trigger="change"
                        hx-target="#dashboard-overview"
                        hx-include="closest .kpi-filter">
                    <option value="">Tous les mois</option>
                    {% set mois_labels = ['Jan','Fév','Mar','Avr','Mai','Juin','Juil','Août','Sep','Oct','Nov','Déc'] %}
                    {% for m in range(1, 13) %}
                    <option value="{{ m }}" {% if selected_month == m %}selected{% endif %}>{{ mois_labels[m-1] }}</option>
                    {% endfor %}
                </select>
            </div>
        </div>
        <div class="overflow-x-auto">
            <table class="table table-sm dashboard-table">
                <thead>
                    <tr>
                        <th></th>
                        <th class="text-right">Montant</th>
                    </tr>
                </thead>
                <tbody>
                    <tr class="font-bold border-b-2 border-primary/30">
                        <td><i class="fas fa-layer-group text-primary mr-2"></i>Total</td>
                        <td class="text-right text-primary dashboard-money">{{ total_montant|currency(0) }} DA</td>
                    </tr>
                    <tr>
                        <td><i class="fas fa-building societe-srid mr-2"></i>SRID</td>
                        <td class="text-right"><span class="badge badge-sm border-transparent font-semibold dashboard-money" style="background: var(--societe-srid-alpha); color: var(--societe-srid);">{{ montant_srid|currency(0) }} DA</span></td>
                    </tr>
                    <tr>
                        <td><i class="fas fa-dna societe-genetics mr-2"></i>SRID Genetics</td>
                        <td class="text-right"><span class="badge badge-sm border-transparent font-semibold dashboard-money" style="background: var(--societe-genetics-alpha); color: var(--societe-genetics);">{{ montant_genetics|currency(0) }} DA</span></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
